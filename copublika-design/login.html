<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — CoPublika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<style>
  body { background: var(--bg-alt); }
  main { padding-top: 72px; min-height: 100vh; display: flex; }
  .auth-wrap {
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    width: 100%;
    min-height: calc(100vh - 72px);
  }
  @media (max-width: 900px) { .auth-wrap { grid-template-columns: 1fr; } }

  .auth-form {
    background: var(--bg);
    padding: clamp(40px, 6vw, 80px);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .auth-form .inner {
    max-width: 420px;
    width: 100%;
    margin: 0 auto;
  }
  .auth-eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .auth-eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--accent); }
  .auth-form h1 {
    font-size: clamp(36px, 4vw, 48px);
    letter-spacing: -0.025em;
    line-height: 1;
    margin-bottom: 14px;
  }
  .auth-form .sub {
    color: var(--ink-3);
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 40px;
  }
  .auth-form .sub a { color: var(--accent); }
  .auth-form .sub a:hover { text-decoration: underline; }

  .auth-field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .auth-field label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .auth-field input {
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 15px;
    transition: border-color 0.2s;
  }
  .auth-field input:focus { outline: 0; border-color: var(--ink); }
  .auth-row {
    display: flex; justify-content: space-between; align-items: center;
    margin: 8px 0 24px;
  }
  .auth-checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
  .auth-checkbox input { width: 16px; height: 16px; accent-color: var(--accent); }
  .auth-row .fp { font-size: 13px; color: var(--accent); }
  .auth-row .fp:hover { text-decoration: underline; }

  .auth-divider {
    display: flex; align-items: center; gap: 14px;
    margin: 32px 0;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .auth-divider::before, .auth-divider::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }
  .auth-social {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .auth-social .btn-line {
    padding: 12px 14px;
    display: flex; align-items: center; gap: 10px; justify-content: center;
    font-size: 14px;
  }
  .auth-social svg { width: 18px; height: 18px; }

  /* Marketing side */
  .auth-aside {
    background: var(--ink);
    color: white;
    padding: clamp(40px, 6vw, 80px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .auth-aside::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 20% 30%, rgba(233,113,28,0.16), transparent 50%);
    pointer-events: none;
  }
  .auth-aside .logo-row img { height: 28px; }
  .auth-aside .marketing {
    position: relative;
    z-index: 1;
    margin-top: auto;
  }
  .auth-aside .quote-mark {
    font-size: 80px;
    line-height: 0.6;
    color: var(--accent);
    font-family: serif;
    margin-bottom: 24px;
  }
  .auth-aside blockquote {
    font-size: clamp(22px, 2.4vw, 30px);
    line-height: 1.25;
    letter-spacing: -0.015em;
    text-wrap: pretty;
    margin-bottom: 32px;
    max-width: 28ch;
  }
  .auth-aside .who {
    display: flex; gap: 14px; align-items: center;
    padding-top: 24px;
    border-top: 1px solid #2a2a2a;
  }
  .auth-aside .who .av {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #2a2a2a;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-size: 13px;
    color: white;
  }
  .auth-aside .who .name { font-size: 15px; font-weight: 500; }
  .auth-aside .who .role { font-family: var(--mono); font-size: 11px; color: #999; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 4px; }

  .auth-aside .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    margin-top: 48px;
    padding-top: 32px;
    border-top: 1px solid #2a2a2a;
    position: relative;
    z-index: 1;
  }
  .auth-aside .stats .v { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; margin-bottom: 8px; }
  .auth-aside .stats .v .accent { color: var(--accent); }
  .auth-aside .stats .l { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #999; }
</style>
</head>
<body>
<div id="site-header"></div>
<main data-screen-label="Log In">
  <div class="auth-wrap">
    <div class="auth-form">
      <div class="inner">
        <div class="auth-eyebrow"><span data-i18n-id="Selamat datang kembali" data-i18n-en="Welcome back">Selamat datang kembali</span></div>
        <h1 data-i18n-id="Masuk ke akun anda." data-i18n-en="Log in to your account.">Masuk ke akun anda.</h1>
        <p class="sub" data-i18n-id="Belum punya akun? <a href='register.html'>Daftar di sini</a>." data-i18n-en="Don't have an account? <a href='register.html'>Register here</a>.">Belum punya akun? <a href="register.html">Daftar di sini</a>.</p>

        <form onsubmit="event.preventDefault(); alert('Demo login. Hubungkan ke backend untuk aktivasi.');">
          <div class="auth-field">
            <label>Email</label>
            <input type="email" required placeholder="anda@kampus.ac.id">
          </div>
          <div class="auth-field">
            <label data-i18n-id="Kata sandi" data-i18n-en="Password">Kata sandi</label>
            <input type="password" required placeholder="••••••••">
          </div>
          <div class="auth-row">
            <label class="auth-checkbox">
              <input type="checkbox"> <span data-i18n-id="Ingat saya" data-i18n-en="Remember me">Ingat saya</span>
            </label>
            <a class="fp" href="#" data-i18n-id="Lupa kata sandi?" data-i18n-en="Forgot password?">Lupa kata sandi?</a>
          </div>
          <button class="btn btn-dark btn-lg btn-arrow" type="submit" style="width: 100%;" data-i18n-id="Masuk" data-i18n-en="Log In">Masuk</button>
        </form>

        <div class="auth-divider"><span data-i18n-id="Atau lanjutkan dengan" data-i18n-en="Or continue with">Atau lanjutkan dengan</span></div>

        <div class="auth-social">
          <button class="btn btn-line">
            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.83z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
            Google
          </button>
          <button class="btn btn-line">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7v-7H9.7v-2.7H12V9.4c0-2.3 1.4-3.6 3.4-3.6 1 0 1.8.1 2.1.1V8h-1.4c-1.1 0-1.4.5-1.4 1.4v1.9H18l-.4 2.7h-2.5V21H19a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>
            Facebook
          </button>
        </div>
      </div>
    </div>

    <aside class="auth-aside">
      <div class="logo-row">
        <img src="assets/img/logo-white.png" alt="CoPublika">
      </div>
      <div class="marketing">
        <div class="quote-mark">"</div>
        <blockquote data-i18n-id="Masuk ke komunitas yang sedang menulis bersama hari ini." data-i18n-en="Log in to a community that's writing together today.">Masuk ke komunitas yang sedang menulis bersama hari ini.</blockquote>
        <div class="who">
          <div class="av">CP</div>
          <div>
            <div class="name" data-i18n-id="Tim CoPublika" data-i18n-en="The CoPublika Team">Tim CoPublika</div>
            <div class="role" data-i18n-id="Yogyakarta · Indonesia" data-i18n-en="Yogyakarta · Indonesia">Yogyakarta · Indonesia</div>
          </div>
        </div>
        <div class="stats">
          <div>
            <div class="v">1,240<span class="accent">+</span></div>
            <div class="l" data-i18n-id="Anggota" data-i18n-en="Members">Anggota</div>
          </div>
          <div>
            <div class="v">318</div>
            <div class="l" data-i18n-id="Publikasi" data-i18n-en="Publications">Publikasi</div>
          </div>
          <div>
            <div class="v">47</div>
            <div class="l" data-i18n-id="Mentor" data-i18n-en="Mentors">Mentor</div>
          </div>
        </div>
      </div>
    </aside>
  </div>
</main>
<div id="site-footer" style="display:none;"></div>
<script src="assets/js/main.js"></script>
<script>
  CoPublika.init();
  document.querySelectorAll('[data-i18n-id]').forEach(el => {
    if (el.getAttribute('data-i18n-id').includes('<')) el.innerHTML = el.getAttribute('data-i18n-id');
  });
</script>
</body>
</html>
