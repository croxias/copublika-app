      - 'img "Anatomi Naskah yang Diterima Q1: Membedah Tiga Naskah CoPublika dari Submit hingga Acceptance" [ref=e64]'
      - generic [ref=e65]:
        - article [ref=e67]:
          - 'heading "Pembedahan Mendalam Tiga Naskah Cohort #05" [level=2] [ref=e68]'
          - paragraph [ref=e69]: "Tiga naskah peserta Cohort #05 berhasil menembus seleksi ketat di jurnal Q1 (terindeks Scopus dengan dampak tinggi) dalam waktu kurang dari 6 bulan. Melalui artikel ini, kami membedah anatomi dari ketiga naskah tersebut untuk menemukan kesamaan pola, strategi revisi, dan kerangka berpikir yang membuat mereka diterima."
          - heading "1. Perumusan State of the Art (SOTA) yang Tajam" [level=3] [ref=e70]
          - paragraph [ref=e71]:
            - text: Ketiga naskah sukses ini memiliki benang merah yang sama pada bagian pendahuluan (
            - emphasis [ref=e72]: Introduction
            - text: ). Mereka tidak hanya menceritakan latar belakang masalah, tetapi secara eksplisit merumuskan kesenjangan penelitian (
            - emphasis [ref=e73]: research gap
            - text: ) di paragraf kedua dan ketiga.
          - list [ref=e75]:
            - listitem [ref=e76]:
              - strong [ref=e77]: Pola Umum
              - text: ": Penulis menyajikan tabel ringkasan penelitian terdahulu untuk memetakan apa yang sudah diteliti dan di mana letak posisi penelitian mereka saat ini."
            - listitem [ref=e78]:
              - strong [ref=e79]: Kesalahan yang Dihindari
              - text: ": Menulis latar belakang yang terlalu umum (seperti sejarah subjek yang terlalu luas) tanpa mengerucut ke masalah spesifik yang ingin diselesaikan."
          - heading "2. Metodologi yang Sangat Reproduksibel" [level=3] [ref=e80]
          - paragraph [ref=e81]: Naskah yang diterima di Q1 selalu menyajikan metodologi secara transparan dan detail. Reviewer di jurnal bereputasi tinggi sangat sensitif terhadap validitas dan reproduksibilitas metode penelitian.
          - list [ref=e83]:
            - listitem [ref=e84]:
              - strong [ref=e85]: Pola Umum
              - text: ": Penulis melampirkan diagram alur penelitian ("
              - emphasis [ref=e86]: research flowchart
              - text: ) dan menyediakan datasets atau instrumen penelitian di repositori publik (seperti OSF atau Zenodo).
            - listitem [ref=e87]:
              - strong [ref=e88]: Tindakan Revisi Penting
              - text: ": Saat reviewer meminta klarifikasi mengenai penentuan ukuran sampel, penulis merespons dengan menyajikan analisis kekuatan statistik ("
              - emphasis [ref=e89]: statistical power analysis
              - text: ) tambahan yang kokoh.
          - heading "3. Diskusi Temuan yang Berorientasi Teoretis (Bukan Sekadar Laporan Data)" [level=3] [ref=e90]
          - paragraph [ref=e91]:
            - text: Kesalahan fatal sebagian besar penulis pemula adalah menulis bagian
            - emphasis [ref=e92]: Discussion
            - text: seperti rangkuman hasil. Pada ketiga naskah ini, bagian diskusi merupakan porsi terberat dan paling mendalam.
          - list [ref=e94]:
            - listitem [ref=e95]:
              - strong [ref=e96]: Pola Umum
              - text: ": Penulis membandingkan temuan mereka dengan setidaknya 10-15 artikel kunci yang relevan dari jurnal internasional bereputasi dalam 3 tahun terakhir."
            - listitem [ref=e97]:
              - strong [ref=e98]: Kutipan Reviewer
              - text: ":"
              - emphasis [ref=e99]: "\"The discussion successfully positions the local empirical findings within the broader global theoretical framework of adaptive policy making.\""
          - blockquote [ref=e100]: "\"Reviewer tidak mencari kesempurnaan absolut dalam metodologi Anda, melainkan kejujuran akademik, transparansi langkah, dan kemampuan memetakan kontribusi ilmiah Anda di panggung global.\" — Dr. Ade Putranto"
          - heading "Langkah Menuju Naskah Q1 Anda" [level=3] [ref=e101]
          - list [ref=e103]:
            - listitem [ref=e104]:
              - strong [ref=e105]: Petakan Literatur
              - text: ": Identifikasi 5-10 artikel utama dari jurnal target Anda sebelum mulai menulis."
            - listitem [ref=e106]:
              - strong [ref=e107]: Gunakan IMRaD
              - text: ": Disiplinkan struktur penulisan Anda sesuai standar internasional."
            - listitem [ref=e108]:
              - strong [ref=e109]: Siapkan Repositori Terbuka
              - text: ": Publikasikan instrumen atau data mentah Anda jika memungkinkan untuk menumbuhkan kepercayaan reviewer."
