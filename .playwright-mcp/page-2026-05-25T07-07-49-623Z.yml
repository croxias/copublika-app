              - paragraph [ref=e85]: "Tiga naskah peserta Cohort #05 berhasil menembus seleksi ketat di jurnal Q1 (terindeks Scopus dengan dampak tinggi) dalam waktu kurang dari 6 bulan. Melalui artikel ini, kami membedah anatomi dari ketiga naskah tersebut untuk menemukan kesamaan pola, strategi revisi, dan kerangka berpikir yang membuat mereka diterima."
              - heading "1. Perumusan State of the Art (SOTA) yang Tajam" [level=3] [ref=e86]
              - paragraph [ref=e87]:
                - text: Ketiga naskah sukses ini memiliki benang merah yang sama pada bagian pendahuluan (
                - emphasis [ref=e88]: Introduction
                - text: ). Mereka tidak hanya menceritakan latar belakang masalah, tetapi secara eksplisit merumuskan kesenjangan penelitian (
                - emphasis [ref=e89]: research gap
                - text: ) di paragraf kedua dan ketiga.
              - list [ref=e91]:
                - listitem [ref=e92]:
                  - strong [ref=e93]: Pola Umum
                  - text: ": Penulis menyajikan tabel ringkasan penelitian terdahulu untuk memetakan apa yang sudah diteliti dan di mana letak posisi penelitian mereka saat ini."
                - listitem [ref=e94]:
                  - strong [ref=e95]: Kesalahan yang Dihindari
                  - text: ": Menulis latar belakang yang terlalu umum (seperti sejarah subjek yang terlalu luas) tanpa mengerucut ke masalah spesifik yang ingin diselesaikan."
              - heading "2. Metodologi yang Sangat Reproduksibel" [level=3] [ref=e96]
              - paragraph [ref=e97]: Naskah yang diterima di Q1 selalu menyajikan metodologi secara transparan dan detail. Reviewer di jurnal bereputasi tinggi sangat sensitif terhadap validitas dan reproduksibilitas metode penelitian.
              - list [ref=e99]:
                - listitem [ref=e100]:
                  - strong [ref=e101]: Pola Umum
                  - text: ": Penulis melampirkan diagram alur penelitian ("
                  - emphasis [ref=e102]: research flowchart
                  - text: ) dan menyediakan datasets atau instrumen penelitian di repositori publik (seperti OSF atau Zenodo).
                - listitem [ref=e103]:
                  - strong [ref=e104]: Tindakan Revisi Penting
                  - text: ": Saat reviewer meminta klarifikasi mengenai penentuan ukuran sampel, penulis merespons dengan menyajikan analisis kekuatan statistik ("
                  - emphasis [ref=e105]: statistical power analysis
                  - text: ) tambahan yang kokoh.
              - heading "3. Diskusi Temuan yang Berorientasi Teoretis (Bukan Sekadar Laporan Data)" [level=3] [ref=e106]
